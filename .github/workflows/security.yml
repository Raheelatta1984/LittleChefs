name: Security and quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject credentials in web storage
        shell: bash
        run: |
          if grep -rniE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=.next \
            '(localStorage|sessionStorage)\.(setItem|getItem)[[:space:]]*\([^,)]{0,40}(token|jwt|auth|secret|api[_-]?key|credential|refresh|id_token|access)' \
            src 2>/dev/null | grep -vFf .security-storage-allowlist; then
            echo "Credential-like browser storage access is forbidden."
            exit 1
          fi
      - name: Type-check
        run: npm run typecheck
      - name: Test
        # PGlite/WASM test databases are memory-heavy; serialize test files on
        # shared CI runners while preserving the complete suite.
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test-output.log
      - name: Publish test failure details
        if: failure()
        shell: bash
        run: |
          {
            echo '## Test failure output'
            echo '```text'
            tail -n 160 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
