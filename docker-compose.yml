# Production-style PostgreSQL for Chef Universe.
#   docker compose up -d
#   DATABASE_URL=postgres://chef:chef@localhost:5432/chefuniverse npm run db:migrate
#   DATABASE_URL=postgres://chef:chef@localhost:5432/chefuniverse npm run server
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chef
      POSTGRES_PASSWORD: chef
      POSTGRES_DB: chefuniverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chef -d chefuniverse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
